auto: no
dry-run: no
write: yes
threads: 1
force: no
quiet: no
keep_output: no
keep_profiles: no

essentia_extractor: /your/path/to/streaming_extractor_music
extractor_profile:
  outputFormat: json
  outputFrames: 0
  lowlevel:
    frameSize: 2048
    hopSize: 1024
  highlevel:
    compute: 1
    svm_models:
      - /your/path/to/svm_model.history
  chromaprint:
    compute: 0

# Prepended to the name of every field below (e.g. "xtractor_")
field_prefix: ""

# What happens to the `bpm` field of beets when a prefix is set:
#   force:      always overwrite it
#   if_empty:   only set it when the item has no bpm yet
#   if_similar: like if_empty, but also overwrite a bpm that differs by at most prefix_bpm_max_difference
#   never:      leave it alone
prefix_bpm_behavior: force
prefix_bpm_max_difference: 2

low_level_targets:
  bpm:
    path: "rhythm.bpm"
    type: integer
    required: yes
  danceability:
    path: "rhythm.danceability"
    type: float
  beats_count:
    path: "rhythm.beats_count"
    type: integer
  average_loudness:
    path: "lowlevel.average_loudness"
    type: float
    required: yes

high_level_targets:
  key_edma: # e.g. "C#"
    path: "tonal.key_edma.key"
    type: string
  key_edma_scale: # e.g. "minor"
    path: "tonal.key_edma.scale"
    type: string
  tonal_atonal: # "tonal" or "atonal"
    path: "highlevel.tonal_atonal.value"
    type: string
  voice_instrumental:
    path: "highlevel.voice_instrumental.value"
    type: string
    required: yes
  is_voice:
    path: "highlevel.voice_instrumental.all.voice"
    type: float
  is_instrumental:
    path: "highlevel.voice_instrumental.all.instrumental"
    type: float
  gender:
    path: "highlevel.gender.value"
    type: string
    required: yes
  is_male:
    path: "highlevel.gender.all.male"
    type: float
  is_female:
    path: "highlevel.gender.all.female"
    type: float
  timbre: # "dark" or "bright"
    path: "highlevel.timbre.value"
    type: string
  danceable:
    path: "highlevel.danceability.all.danceable"
    type: float
    required: yes
  genre_rosamerica:
    path: "highlevel.genre_rosamerica.value"
    type: string
    required: yes
  genre_rosamerica_probability: # 0..1
    path: "highlevel.genre_rosamerica.probability"
    type: float
  genre_electronic:
    path: "highlevel.genre_electronic.value"
    type: string
  genre_electronic_probability: # 0..1
    path: "highlevel.genre_electronic.probability"
    type: float
  mood_acoustic:
    path: "highlevel.mood_acoustic.all.acoustic"
    type: float
    required: yes
  mood_aggressive:
    path: "highlevel.mood_aggressive.all.aggressive"
    type: float
    required: yes
  mood_electronic:
    path: "highlevel.mood_electronic.all.electronic"
    type: float
    required: yes
  mood_happy:
    path: "highlevel.mood_happy.all.happy"
    type: float
    required: yes
  mood_sad:
    path: "highlevel.mood_sad.all.sad"
    type: float
    required: yes
  mood_party:
    path: "highlevel.mood_party.all.party"
    type: float
    required: yes
  mood_relaxed:
    path: "highlevel.mood_relaxed.all.relaxed"
    type: float
    required: yes

  # mirex
  mood_mirex:
    path: "highlevel.moods_mirex.value"
    type: string
    required: yes
  mood_mirex_cluster_1:
    path: "highlevel.moods_mirex.all.Cluster1"
    type: float
  mood_mirex_cluster_2:
    path: "highlevel.moods_mirex.all.Cluster2"
    type: float
  mood_mirex_cluster_3:
    path: "highlevel.moods_mirex.all.Cluster3"
    type: float
  mood_mirex_cluster_4:
    path: "highlevel.moods_mirex.all.Cluster4"
    type: float
  mood_mirex_cluster_5:
    path: "highlevel.moods_mirex.all.Cluster5"
    type: float
